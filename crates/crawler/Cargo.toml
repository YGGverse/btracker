[package]
name = "btracker-crawler"
version = "0.4.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "SSD-friendly FS crawler of BEP 48 / Full Scrape, based on librqbit"
keywords = ["bittorrent", "dht", "i2p", "librqbit", "crawler"]
categories = ["network-programming"]
repository = "https://github.com/YGGverse/btracker"
# homepage = "https://yggverse.github.io"

[dependencies]
anyhow = "1.0.104"
btpeer = "0.13.3"
btracker-fs = { version = "0.5.2", features = ["crawler"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cyphernet = { version = "0.5.4", features = ["i2p"] }
data-encoding = "2.11.1"
librqbit = { version = "9.1.0", default-features = false, features = ["disable-upload", "rust-tls"] }
log = "0.4.35"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-inline-default = "1.0.3"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
yosemite =  "0.7.0"
