[package]
name = "btracker-gemini"
version = "0.3.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "βtracker server implementation for the Gemini protocol"
keywords = ["btracker", "bittorrent", "gemini", "gemini-protocol", "server"]
categories = ["database-implementations", "network-programming", "filesystem"]
repository = "https://github.com/YGGverse/btracker"

[dependencies]
anyhow = "1.0.95"
btracker-fs = { version = "0.5.2", features = ["public"] }
btracker-scrape = "0.3.0"
chrono = "0.4.45"
clap = { version = "4.5.30", features = ["derive"] }
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }
log = "0.4.28"
p12-keystore = "0.4.1"
plurify = "0.2.0"
regex = "1.11.2"
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
titanite = "0.3.2"
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = "0.26.6"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
urlencoding = "2.1.3"
